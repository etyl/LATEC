[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latec"
version = "0.1.0"
description = "Error-bounded SZ-style compression with interpolation and GNN predictors."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LATEC contributors" }
]
dependencies = [
    "numpy",
    "scipy",
    "zstandard",
    "constriction~=0.4.2",
]

[project.optional-dependencies]
image = ["pillow"]
gnn = ["torch"]
eval = ["pysz"]
test = ["pytest", "pillow", "torch", "ruff"]
all = ["pillow", "torch", "pysz"]

[project.scripts]
latec = "latec.cli:main"

[tool.setuptools.packages.find]
include = ["latec*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
